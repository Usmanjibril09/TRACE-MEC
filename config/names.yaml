  "sigma=1":    {short: "σ_s = 1 m"}
  "sigma=10":   {short: "σ_s = 10 m"}
  "t_p=0.02":   {short: "t_p = 20 ms"}
  "t_p=0.1":    {short: "t_p = 100 ms"}
  "kappa=0.5":  {short: "κ = 0.5"}
  "kappa=0.25": {short: "κ = 0.25"}
